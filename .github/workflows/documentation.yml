name: Documentation

on:
  push:
    branches:
      - master
      - dev
    tags: ['*']
  # pull_request:

jobs:
  build:
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        env:
          JULIA_PKG_PRECOMPILE_AUTO: 0  # precompiling would load PRIMA_jll before it is patched
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      # PRIMA_jll ships libprimac.so with an executable-stack flag, which newer
      # Linux runners refuse to load ("cannot enable executable stack").
      - name: Patch PRIMA libraries (executable stack)
        run: |
          sudo apt-get install -y patchelf
          for f in $(find ~/.julia/artifacts -name 'libprima*.so*'); do
            chmod u+w "$(dirname "$f")" "$f"  # artifacts are read-only
            patchelf --clear-execstack "$f"
          done
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs/ docs/make.jl
