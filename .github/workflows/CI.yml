name: CI
on:
  push:
    branches:
      - master
      - dev
    tags: ['*']
  # pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
          - 'lts'
        os:
          - ubuntu-latest
          - macOS-latest
          # - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # PRIMA_jll ships libprimac.so with an executable-stack flag, which newer
      # Linux runners refuse to load ("cannot enable executable stack").
      # Download artifacts WITHOUT precompiling (precompiling loads PRIMA_jll and
      # would fail), patch them, and only then build.
      - name: Patch PRIMA libraries (executable stack)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y patchelf
          JULIA_PKG_PRECOMPILE_AUTO=0 julia --project=. -e 'import Pkg; Pkg.instantiate()'
          for f in $(find ~/.julia/artifacts -name 'libprima*.so*'); do
            chmod u+w "$(dirname "$f")" "$f"  # artifacts are read-only
            patchelf --clear-execstack "$f"
          done
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
